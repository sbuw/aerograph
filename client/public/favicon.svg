<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background globe sphere gradient -->
    <radialGradient id="globe-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#111a2e" />
      <stop offset="70%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Arc gradients -->
    <linearGradient id="cyan-arc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="amber-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <!-- Atmospheric outer glow -->
    <radialGradient id="atmo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="96%" stop-color="#00f2fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Filters for radiant glow -->
    <filter id="glow-cyan" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-amber" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-dot" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Atmospheric halo rim -->
  <circle cx="32" cy="32" r="30" fill="url(#atmo-glow)" />

  <!-- Base Globe Sphere -->
  <circle cx="32" cy="32" r="27" fill="url(#globe-grad)" stroke="#1e293b" stroke-width="1.2" />

  <!-- Latitudinal & Longitudinal subtle grid rings -->
  <!-- Longitude ellipses -->
  <ellipse cx="32" cy="32" rx="13" ry="27" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.85" />
  <ellipse cx="32" cy="32" rx="22" ry="27" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />
  <line x1="32" y1="5" x2="32" y2="59" stroke="#334155" stroke-width="0.9" opacity="0.8" />

  <!-- Latitude lines -->
  <line x1="5" y1="32" x2="59" y2="32" stroke="#334155" stroke-width="0.9" opacity="0.8" />
  <ellipse cx="32" cy="20" rx="23.5" ry="6" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.75" />
  <ellipse cx="32" cy="44" rx="23.5" ry="6" fill="none" stroke="#1e293b" stroke-width="0.7" opacity="0.6" />

  <!-- Teleconnection Wave Arcs -->
  <!-- Cyan Arc (Trans-Atlantic / Pacific Lead Wave) -->
  <path d="M 14 36 C 18 16, 42 14, 51 28"
        fill="none"
        stroke="url(#cyan-arc)"
        stroke-width="2.2"
        stroke-linecap="round"
        filter="url(#glow-cyan)" />

  <!-- Amber Arc (Arctic / Meridional Wave) -->
  <path d="M 23 48 C 28 32, 46 22, 45 15"
        fill="none"
        stroke="url(#amber-arc)"
        stroke-width="1.8"
        stroke-linecap="round"
        stroke-dasharray="3.5 1.8"
        filter="url(#glow-amber)" />

  <!-- Secondary subtle harmonic arc -->
  <path d="M 14 36 C 26 44, 42 42, 51 28"
        fill="none"
        stroke="#00f2fe"
        stroke-width="0.75"
        stroke-opacity="0.45"
        stroke-dasharray="2 2" />

  <!-- Teleconnection Node Dots -->
  <!-- Node A (West/Pacific) -->
  <circle cx="14" cy="36" r="2.8" fill="#00f2fe" filter="url(#glow-dot)" />
  <circle cx="14" cy="36" r="1.3" fill="#ffffff" />

  <!-- Node B (Polar / Crest) -->
  <circle cx="34" cy="18" r="2.2" fill="#ffffff" filter="url(#glow-dot)" />
  <circle cx="34" cy="18" r="1.1" fill="#00f2fe" />

  <!-- Node C (East / Atlantic) -->
  <circle cx="51" cy="28" r="2.8" fill="#00f2fe" filter="url(#glow-dot)" />
  <circle cx="51" cy="28" r="1.3" fill="#ffffff" />

  <!-- Node D (Subtropical / Amber origin) -->
  <circle cx="23" cy="48" r="2.4" fill="#f59e0b" filter="url(#glow-dot)" />
  <circle cx="23" cy="48" r="1.1" fill="#ffffff" />

  <!-- Node E (Arctic Oscillation Apex) -->
  <circle cx="45" cy="15" r="2.2" fill="#fbbf24" filter="url(#glow-dot)" />
  <circle cx="45" cy="15" r="1" fill="#ffffff" />
</svg>
